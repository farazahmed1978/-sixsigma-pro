<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#081225" />
    <script>
      (function () {
        var saved = localStorage.getItem('sp-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      }());
    </script>
    <meta name="description" content="Aureqin — The productivity platform for professionals. Perform, optimize, and transform work across connected professional suites." />
    <meta name="keywords" content="operational excellence, lean six sigma, project management, statistical analysis, DMAIC, project workspaces" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AUREQIN | The Productivity Platform for Professionals</title>
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #050d1a; color: #e8f0fe; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; }
      /* Prevent horizontal scroll on mobile */
      html, body { overflow-x: hidden; max-width: 100vw; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
